<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ukraine Support Tracker – Total Allocations by Region</title>
  <style>
    :root {
      --font: Arial, sans-serif;
      --font-serif: Arial, sans-serif;
      --black: #1a1a1a;
      --mid: #6b6b6b;
      --border: #d0d0d0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: var(--font); font-size: 14px; background: #f6f1e7; color: var(--black); line-height: 1.5; margin: 0; padding: 0; }

    .explorer-scale-container {
      width: 100%;
      max-width: 1288px;
      margin: 0 auto;
      overflow: hidden;
    }

    .explorer-wrap {
      display: flex;
      flex-direction: column;
      width: 565px;
      height: 496px;
      border: 1px solid #ddd6c8;
      border-radius: 6px;
      overflow: hidden;
      background: #f6f1e7;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
      transform-origin: top left;
      position: relative;
    }

    .chart-header {
      padding: 0.9rem 1.1rem 0.7rem;
      padding-right: 185px;
      border-bottom: 1px solid #ddd6c8;
      position: relative;
      flex-shrink: 0;
      background: #f6f1e7;
      min-height: 76.5px;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .chart-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: #174abb;
      margin-bottom: 0rem;
    }
    .kiel-logo {
      position: absolute;
      top: 50%; right: 17px;
      transform: translateY(-50%);
      line-height: 0;
      z-index: 1;
      display: flex;
      align-items: center;
    }
    .kiel-logo img { height: 40px; width: auto; display: block; }

    /* ── RING CHART BODY ─────────────────────────────────────── */
    .ring-body {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 3rem;
      padding: 1rem 1.3rem;
      min-height: 0;
      position: relative;
    }
    .ring-svg-wrap {
      flex-shrink: 0;
      width: 270px;
      height: 270px;
      position: relative;
    }
    #ring-svg { width: 100%; height: 100%; display: block; }
    .ring-center-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    .ring-center-value {
      font-size: 1.95rem;
      font-weight: 700;
      color: #174abb;
      line-height: 1.15;
    }
    .ring-center-caption {
      font-size: 0.88rem;
      color: var(--mid);
      margin-top: 0.15rem;
    }
    .ring-slice {
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .ring-slice:hover { opacity: 0.82; }

    .ring-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0rem;
      min-width: 0;
    }
    .ring-legend-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      cursor: pointer;
      position: relative;
    }
    .ring-legend-swatch {
      width: 12px; height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .ring-legend-text {
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin-right: 0.4rem;
    }
    .ring-legend-name {
      font-size: 1.0625rem;
      font-weight: 400;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ring-legend-value {
      font-size: 1.02rem;
      font-weight: 700;
      color: #ff6b00;
      white-space: nowrap;
      flex: 1;
      text-align: right;
    }
    .ring-slice-label {
      font-size: 5.6px;
      font-weight: 700;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* ── contributor popup (follows cursor over the ring) ── */
    #ring-hover-popup {
      display: none;
      position: absolute;
      z-index: 250;
      background: #f6f1e7;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18);
      width: 205px;
      max-height: 190px;
      padding: 0.55rem 0;
      font-family: var(--font);
    }
    #ring-hover-popup.show { display: block; }
    .ring-popup-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.15rem 0.5rem;
      padding: 0 0.7rem 0.4rem;
      border-bottom: 1px solid #eee6d8;
      margin-bottom: 0.3rem;
    }
    .ring-popup-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--black);
      flex: 1 1 100px;
    }
    .ring-popup-total {
      font-size: 0.86rem;
      font-weight: 700;
      color: #ff6b00;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .ring-popup-list {
      max-height: 135px;
      overflow-y: auto;
      padding: 0 0.7rem;
    }
    .ring-popup-list::-webkit-scrollbar { width: 5px; }
    .ring-popup-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    .ring-popup-row {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.18rem 0;
      font-size: 0.78rem;
    }
    .ring-popup-country {
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ring-popup-amount {
      color: var(--black);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chart-footer {
      flex-shrink: 0;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.5rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      z-index: 20;
    }
    .footer-icons {
      position: relative;
      display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0;
    }
    .footer-icons::before {
      content: '';
      position: absolute;
      top: -6px; bottom: -6px; right: -8px; left: -40px;
      z-index: -1;
      background: rgba(246,241,231,0.35);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 32px);
      mask-image: linear-gradient(to right, transparent, #000 32px);
    }
    .footer-icon-btn {
      width: 30px; height: 30px; border-radius: 3px;
      border: 1px solid var(--border); background: #f6f1e7;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--mid); transition: background 0.1s;
    }
    .footer-icon-btn:hover { background: #ede8de; color: var(--black); }
    .footer-icon-btn svg { width: 14px; height: 14px; }

    /* share dropdown */
    .share-wrap { position: relative; }
    .share-dropdown {
      display: none; position: absolute; right: 0; bottom: 110%;
      background: #f6f1e7; border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.13); min-width: 210px; z-index: 500; padding: 0.3rem 0;
    }
    .share-dropdown.open { display: block; }
    .share-dropdown-title { font-size: 0.65rem; font-weight: 600; color: #aaa; padding: 0.4rem 1rem 0.2rem; text-transform: uppercase; letter-spacing: 0.07em; }
    .share-option {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 1rem; font-size: 0.76rem; color: #333; cursor: pointer;
    }
    .share-option:hover { background: #ede8de; }
    .share-option svg { width: 15px; height: 15px; opacity: 0.65; flex-shrink: 0; }

    /* copy toast */
    #copy-toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #222; color: #fff; font-size: 0.76rem;
      padding: 0.45rem 1rem; border-radius: 4px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      z-index: 9999; font-family: var(--font);
    }
    #copy-toast.show { opacity: 1; }

    /* ── Info Modal ── */
    #info-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.32); z-index: 3000;
    }
    #info-overlay.open { display: block; }
    #info-modal {
      display: none; position: fixed; z-index: 3001;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      background: #f6f1e7; border: 1px solid #ddd6c8;
      border-radius: 8px; box-shadow: 0 12px 48px rgba(0,0,0,0.25);
      width: 500px; max-width: calc(100vw - 3rem);
      max-height: calc(100vh - 4rem);
      font-family: var(--font);
    }
    #info-modal.open { display: block; }
    #info-modal-inner { padding: 1rem; max-height: calc(100vh - 4rem); overflow-y: auto; }
    #info-modal-inner::-webkit-scrollbar { width: 5px; }
    #info-modal-inner::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    #info-close {
      position: absolute; top: 0.9rem; right: 0.9rem; z-index: 1;
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: #f6f1e7;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--mid); transition: background 0.1s;
    }
    #info-close:hover { background: #ede8de; color: var(--black); }
    #info-close svg { width: 13px; height: 13px; }
    #info-eyebrow {
      font-size: 1.32rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #ff6b00;
      line-height: 1.3; margin-bottom: 1rem; padding-right: 2rem;
    }
    #info-body { font-size: 0.86rem; color: #333; line-height: 1.65; }
    #info-body p { margin: 0 0 0.7rem; }
    #info-body p:last-child { margin-bottom: 0; }
    #info-body .info-tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    #info-body .info-tag {
      display: inline-block; font-size: 0.72rem; font-weight: 600;
      color: #fff; background: #688fdc;
      border: 1px solid #688fdc; border-radius: 3px;
      padding: 0.2rem 0.55rem;
    }
    #info-body .info-source {
      margin-top: 1rem; padding-top: 0.7rem;
      border-top: 1px solid #ddd6c8;
      font-size: 0.75rem; color: var(--mid); line-height: 1.6;
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="../assets/data-loader.js"></script>
<script>
/* ════════════════════════════════════
   DATA
   Regional totals (€ bn), aggregated at runtime from data/data_explorer.csv
   (the same per-country, per-month allocation series used in the Data
   Explorer) — see ../assets/data-loader.js.
   Regions:
     United States         – US
     EU Institutions      – EU (Commission and Council)
     Continental Europe   – Germany, UK, Netherlands, France, Belgium, Italy,
                             Spain, Switzerland, Ireland, Austria, Luxembourg,
                             Portugal, Greece, Denmark, Sweden, Norway,
                             Finland, Poland, Lithuania, Slovakia, Estonia,
                             Romania, Latvia, Croatia, Slovenia, Czechia,
                             Iceland, Hungary, Bulgaria
     Rest of the World    – all other donors (Canada, Australia, Japan,
                             South Korea, Turkiye, etc.)
════════════════════════════════════ */
let REGION_DATA = [];
let RELEASE_LABEL = 'Ukraine Support Tracker, Release 30 (07/2026)';

const CONTINENTAL_EUROPE_COUNTRIES = [
  'Germany','United Kingdom','Netherlands','France','Belgium','Italy','Spain',
  'Switzerland','Ireland','Austria','Luxembourg','Portugal','Greece','Denmark',
  'Sweden','Norway','Finland','Poland','Lithuania','Slovakia','Estonia',
  'Romania','Latvia','Croatia','Slovenia','Czechia','Iceland','Hungary','Bulgaria'
];
const REGION_COLORS = {
  'United States':       '#ff6b00',
  'EU Institutions':     '#0d2c66',
  'Continental Europe':  '#3a6dc5',
  'Rest of the World':   '#c9c0af'
};
const REGION_ORDER = ['United States', 'EU Institutions', 'Continental Europe', 'Rest of the World'];

function regionOf(country){
  if (country === 'United States') return 'United States';
  if (country === 'EU (Commission and Council)') return 'EU Institutions';
  if (CONTINENTAL_EUROPE_COUNTRIES.includes(country)) return 'Continental Europe';
  return 'Rest of the World';
}

function computeRegionData(rows){
  const byCountry = new Map();
  rows.forEach(r => {
    const country = r.country;
    byCountry.set(country, (byCountry.get(country) || 0) + (Number(r.total) || 0));
  });

  const byRegion = new Map();
  byCountry.forEach((value, country) => {
    const region = regionOf(country);
    if (!byRegion.has(region)) byRegion.set(region, []);
    byRegion.get(region).push({ name: country, value });
  });

  return REGION_ORDER.filter(label => byRegion.has(label)).map(label => {
    const contributors = byRegion.get(label);
    const value = contributors.reduce((s, c) => s + c.value, 0);
    return { label, value, color: REGION_COLORS[label], contributors };
  });
}

function fmt(v, dec=2){
  if (v===null||v===undefined||isNaN(v)||v===0) return '–';
  return v.toFixed(dec);
}

function formatBn(v){
  return `€${fmt(v)}B`;
}

function formatContributor(v){
  return `€${fmt(v)}B`;
}

function buildPopupContent(d, total){
  const contributors = [...d.contributors].sort((a, b) => b.value - a.value);
  const pct = (d.value / total) * 100;
  const rows = contributors.map(c => `
    <div class="ring-popup-row">
      <span class="ring-popup-country">${c.name}</span>
      <span class="ring-popup-amount">${formatContributor(c.value)}</span>
    </div>
  `).join('');
  return `
    <div class="ring-popup-header">
      <span class="ring-popup-title">${d.label}</span>
      <span class="ring-popup-total">${formatBn(d.value)} (${fmt(pct)}%)</span>
    </div>
    <div class="ring-popup-list">${rows}</div>
  `;
}

function buildRing(){
  const total = REGION_DATA.reduce((s, d) => s + d.value, 0);
  document.getElementById('ring-center-value').textContent = `€${Math.round(total)}bn`;

  const cx = 50, cy = 50, rOuter = 49, rInner = 29, rLabel = (rOuter + rInner) / 2;
  const svg = document.getElementById('ring-svg');
  const ns = 'http://www.w3.org/2000/svg';
  let angle = -90; // start at top

  const toRad = a => (a * Math.PI) / 180;

  function arcPath(startAngle, endAngle){
    const x1o = cx + rOuter * Math.cos(toRad(startAngle));
    const y1o = cy + rOuter * Math.sin(toRad(startAngle));
    const x2o = cx + rOuter * Math.cos(toRad(endAngle));
    const y2o = cy + rOuter * Math.sin(toRad(endAngle));
    const x1i = cx + rInner * Math.cos(toRad(endAngle));
    const y1i = cy + rInner * Math.sin(toRad(endAngle));
    const x2i = cx + rInner * Math.cos(toRad(startAngle));
    const y2i = cy + rInner * Math.sin(toRad(startAngle));
    const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
    return `M ${x1o} ${y1o} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2i} ${y2i} Z`;
  }

  REGION_DATA.forEach(d => {
    const sweep = (d.value / total) * 360;
    const pct = (d.value / total) * 100;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', arcPath(angle, angle + sweep));
    path.setAttribute('fill', d.color);
    path.setAttribute('class', 'ring-slice');
    path.setAttribute('stroke', '#f6f1e7');
    path.setAttribute('stroke-width', '0.6');
    const title = document.createElementNS(ns, 'title');
    title.textContent = `${d.label}: ${formatBn(d.value)} (${pct.toFixed(1)}%)`;
    path.appendChild(title);
    svg.appendChild(path);

    if (pct >= 4 && !d.hideLabel) {
      const midAngle = angle + sweep / 2;
      const lx = cx + rLabel * Math.cos(toRad(midAngle));
      const ly = cy + rLabel * Math.sin(toRad(midAngle));
      const label = document.createElementNS(ns, 'text');
      label.setAttribute('x', lx);
      label.setAttribute('y', ly);
      label.setAttribute('class', 'ring-slice-label');
      label.textContent = `${pct.toFixed(1)}%`;
      svg.appendChild(label);
    }

    angle += sweep;
  });

  const legend = document.getElementById('ring-legend');
  legend.innerHTML = REGION_DATA.map(d => `
    <div class="ring-legend-item">
      <span class="ring-legend-swatch" style="background:${d.color}"></span>
      <span class="ring-legend-text">
        <span class="ring-legend-name">${d.label}</span>
      </span>
    </div>
  `).join('');

  setupRingHoverPopups(total);
}

function setupRingHoverPopups(total){
  const svg = document.getElementById('ring-svg');
  const ringBody = document.querySelector('.ring-body');
  const popup = document.getElementById('ring-hover-popup');
  const slices = svg.querySelectorAll('.ring-slice');
  let hideTimer = null;
  let pinned = false;

  function cancelHide(){
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }
  function scheduleHide(){
    if (pinned) return;
    cancelHide();
    hideTimer = setTimeout(() => popup.classList.remove('show'), 250);
  }
  function closePopup(){
    pinned = false;
    cancelHide();
    popup.classList.remove('show');
  }
  // .explorer-wrap is scaled via CSS transform for responsiveness, so
  // getBoundingClientRect() returns visual (scaled) pixels while
  // clientWidth/offsetWidth stay in unscaled layout pixels. Convert
  // cursor deltas into layout space before positioning, or the popup
  // drifts away from the cursor as the page is scaled down.
  function positionAt(clientX, clientY){
    const bodyRect = ringBody.getBoundingClientRect();
    const scale = bodyRect.width / ringBody.clientWidth;
    const offset = 14;
    let left = (clientX - bodyRect.left) / scale + offset;
    let top = (clientY - bodyRect.top) / scale + offset;
    const maxLeft = ringBody.clientWidth - popup.offsetWidth - 4;
    const maxTop = ringBody.clientHeight - popup.offsetHeight - 4;
    left = Math.max(4, Math.min(left, maxLeft));
    top = Math.max(4, Math.min(top, maxTop));
    popup.style.left = `${left}px`;
    popup.style.top = `${top}px`;
  }

  slices.forEach((slice, i) => {
    const d = REGION_DATA[i];
    slice.addEventListener('mouseenter', (e) => {
      if (pinned) return;
      cancelHide();
      popup.innerHTML = buildPopupContent(d, total);
      popup.classList.add('show');
      positionAt(e.clientX, e.clientY);
    });
    slice.addEventListener('mousemove', (e) => {
      if (pinned) return;
      positionAt(e.clientX, e.clientY);
    });
    slice.addEventListener('mouseleave', scheduleHide);
    slice.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pinned && popup.dataset.pinnedIndex === String(i)) {
        closePopup();
        return;
      }
      pinned = true;
      cancelHide();
      popup.dataset.pinnedIndex = String(i);
      popup.innerHTML = buildPopupContent(d, total);
      popup.classList.add('show');
      positionAt(e.clientX, e.clientY);
    });
  });

  popup.addEventListener('mouseenter', cancelHide);
  popup.addEventListener('mouseleave', scheduleHide);
  popup.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', () => {
    if (pinned) closePopup();
  });
}

let kielLogoPng = null;
async function getKielLogoPng(){
  if (kielLogoPng) return kielLogoPng;
  const svgText = await fetch('../assets/Kiel Institut Logo.svg').then(r => r.text());
  const svgBlob = new Blob([svgText], {type:'image/svg+xml'});
  const svgUrl  = URL.createObjectURL(svgBlob);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve; img.onerror = reject; img.src = svgUrl;
  });
  const scale = 3;
  const canvas = document.createElement('canvas');
  canvas.width  = img.naturalWidth  * scale;
  canvas.height = img.naturalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(svgUrl);
  kielLogoPng = {
    dataUrl: canvas.toDataURL('image/png'),
    width: img.naturalWidth, height: img.naturalHeight
  };
  return kielLogoPng;
}

/* CSS gives shapes their stroke/fill via stylesheet rules that won't travel with a
   standalone serialized SVG, so bake the relevant computed styles into inline
   style attributes on a 1:1 cloned tree before serializing. */
function inlineComputedStyles(srcEl, destEl){
  const props = ['fill','stroke','stroke-width','stroke-dasharray','opacity','fill-opacity','stroke-opacity','font-size','font-family','font-weight','text-anchor','dominant-baseline'];
  const cs = getComputedStyle(srcEl);
  let style = '';
  props.forEach(p=>{ const v = cs.getPropertyValue(p); if(v) style += `${p}:${v};`; });
  if(style) destEl.setAttribute('style', style + (destEl.getAttribute('style')||''));
  const srcChildren = srcEl.children;
  const destChildren = destEl.children;
  for(let i=0;i<srcChildren.length;i++){
    inlineComputedStyles(srcChildren[i], destChildren[i]);
  }
}

function svgToPngImage(svgEl, w, h){
  return new Promise((resolve,reject)=>{
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));
    const clone = svgEl.cloneNode(true);
    inlineComputedStyles(svgEl, clone);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    if(!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const xml = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w * 2; canvas.height = h * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2,2);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const out = new Image();
      out.onload = () => resolve({img: out, w, h});
      out.onerror = reject;
      out.src = canvas.toDataURL('image/png');
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGE-EXPORT STYLE SETTINGS — tweak these to change the exported PNG.

   All sizes are px of the export layout (the card is laid out `width` px
   wide, then rendered at width × pixelRatio actual image pixels).

   - width          : exported image width. The height follows the ring
                      body's on-screen aspect ratio automatically.
   - pixelRatio     : resolution multiplier for the final PNG (2 = retina).
                      Changes sharpness/file size, not layout proportions.
   - titleFontSize  : the blue title in the header.
   - logoWidth      : Kiel logo width in the top-right corner.
   - headerPadding  : CSS padding of the header block. The 2nd value (right
                      padding, 300px) must stay wide enough that the title
                      doesn't run underneath the logo.
   - ringSize       : diameter of the donut ring in the export.
   - ringGap        : horizontal gap between the ring and its legend.
   - legendFontSize / legendSwatchSize / legendRowGap / legendItemGap :
                      the region legend next to the ring.
   - footerFontSize / footerPadding : the "Data source: …" note at the bottom.
   ═════════════════════════════════════════════════════════════════════ */
const EXPORT_STYLE = {
  width:            1600,
  pixelRatio:       2,
  titleFontSize:    68,
  logoWidth:        340,
  headerPadding:    '20px 380px 16px 22px',
  ringSize:         765,
  ringGap:          136,
  legendFontSize:   45,
  legendSwatchSize: 44,
  legendRowGap:     30,
  legendItemGap:    32,
  footerFontSize:   30,
  footerPadding:    '16px 22px',
};

async function copyChartAsImage(){
  const panel = document.getElementById('explorer-wrap');
  if(!panel) return;

  const EXPORT_W = EXPORT_STYLE.width;

  const card = document.createElement('div');
  card.style.cssText = `position:fixed;left:-99999px;top:0;width:${EXPORT_W}px;background:#f6f1e7;font-family:${getComputedStyle(document.body).fontFamily};color:#1a1a1a;`;

  const header = document.createElement('div');
  header.style.cssText = `position:relative;padding:${EXPORT_STYLE.headerPadding};min-height:110px;box-sizing:border-box;display:flex;align-items:center;`;
  header.innerHTML = `
    <div style="font-size:${EXPORT_STYLE.titleFontSize}px;font-weight:700;line-height:1.25;color:#174abb;">${document.querySelector('.chart-title').textContent}</div>
  `;
  const logoWrap = document.createElement('div');
  logoWrap.style.cssText = `position:absolute;top:20px;right:22px;width:${EXPORT_STYLE.logoWidth}px;display:flex;align-items:center;`;
  const logoImg = document.querySelector('.kiel-logo img');
  const logoClone = logoImg.cloneNode(true);
  logoClone.style.cssText = 'width:100%;height:auto;display:block;';
  logoWrap.appendChild(logoClone);
  header.appendChild(logoWrap);

  /* The ring SVG is CSS width:100%/height:100% inside a fixed 270x270 box, so
     rasterize it directly at export resolution (like the line-chart export)
     rather than laying the clone out at live size and scaling it up with an
     ancestor CSS transform — html2canvas doesn't reliably rasterize a
     swapped-in <img> under a transform:scale() ancestor. */
  const panelClone = panel.cloneNode(true);
  panelClone.querySelectorAll('.chart-header, .footer-icons').forEach(el=>el.remove());
  panelClone.style.border = 'none';
  panelClone.style.borderRadius = '0';
  panelClone.style.boxShadow = 'none';
  panelClone.style.transform = 'none';
  panelClone.style.width = EXPORT_W + 'px';
  /* .explorer-wrap has a fixed height in its own stylesheet rule for the live
     on-screen card; that still applies to the clone via the shared class and
     would clip the export to that height regardless of content. */
  panelClone.style.height = 'auto';
  panelClone.style.overflow = 'visible';

  const panelRect = panel.getBoundingClientRect();
  const scale = EXPORT_W / panelRect.width;

  /* .ring-body is flex:1, filling whatever height is left over after its flex
     siblings. Removing .chart-header/.footer-icons above frees up that space,
     which flex:1 would hand straight to ring-body instead — pin it to its live
     height (scaled) so it keeps the same proportions as on screen. */
  const liveRingBody = panel.querySelector('.ring-body');
  const clonedRingBody = panelClone.querySelector('.ring-body');
  const ringBodyRect = liveRingBody.getBoundingClientRect();
  clonedRingBody.style.flex = 'none';
  clonedRingBody.style.height = Math.round(ringBodyRect.height * scale) + 'px';

  /* .ring-svg-wrap is a fixed 270x270 box (not flex-driven), so size it
     explicitly to EXPORT_STYLE.ringSize instead of staying pinned to its
     live on-screen size. The center label scales along with the ring. */
  const clonedRingSvgWrap = panelClone.querySelector('.ring-svg-wrap');
  const liveRingSvgWrap = panel.querySelector('.ring-svg-wrap');
  const ringSvgWrapRect = liveRingSvgWrap.getBoundingClientRect();
  const ringScale = EXPORT_STYLE.ringSize / ringSvgWrapRect.width;
  if(clonedRingSvgWrap){
    clonedRingSvgWrap.style.width = EXPORT_STYLE.ringSize + 'px';
    clonedRingSvgWrap.style.height = EXPORT_STYLE.ringSize + 'px';
    clonedRingSvgWrap.style.flexShrink = '0';
  }
  const clonedCenterLabel = panelClone.querySelector('.ring-center-label');
  if(clonedCenterLabel) clonedCenterLabel.style.transform = `translate(-50%,-50%) scale(${ringScale})`;

  /* .ring-legend is flex:1 in the live layout, stretching to fill whatever
     width .ring-body has left over — fine on screen where .ring-body is only
     565px wide, but at EXPORT_W it leaves the legend stranded far to the
     right of the ring with lots of dead space. Let it size to its own content
     and sit close to the ring instead, matching the live page's proportions. */
  clonedRingBody.style.gap = EXPORT_STYLE.ringGap + 'px';
  const clonedLegendEl = panelClone.querySelector('#ring-legend');
  if(clonedLegendEl) clonedLegendEl.style.flex = 'none';

  const panelWrap = document.createElement('div');
  panelWrap.style.cssText = `position:relative;width:${EXPORT_W}px;overflow:visible;background:#f6f1e7;`;
  panelWrap.appendChild(panelClone);

  const legend = panelClone.querySelector('#ring-legend');
  if(legend){
    legend.style.fontSize = EXPORT_STYLE.legendFontSize + 'px';
    legend.style.gap = EXPORT_STYLE.legendRowGap + 'px';
    legend.querySelectorAll('.ring-legend-name, .ring-legend-value').forEach(el=>{
      el.style.overflow = 'visible';
      el.style.textOverflow = 'clip';
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize = EXPORT_STYLE.legendFontSize + 'px';
    });
    legend.querySelectorAll('.ring-legend-swatch').forEach(el=>{
      el.style.width = EXPORT_STYLE.legendSwatchSize + 'px';
      el.style.height = EXPORT_STYLE.legendSwatchSize + 'px';
    });
    legend.querySelectorAll('.ring-legend-item').forEach(el=>{ el.style.gap = EXPORT_STYLE.legendItemGap + 'px'; });
  }

  const footer = document.createElement('div');
  footer.style.cssText = `padding:${EXPORT_STYLE.footerPadding};font-size:${EXPORT_STYLE.footerFontSize}px;line-height:1.5;border-top:1px solid #ddd6c8;`;
  footer.innerHTML = `<strong>Data source:</strong> Kiel Institute for the World Economy – ${RELEASE_LABEL}`;

  card.appendChild(header);
  card.appendChild(panelWrap);
  card.appendChild(footer);
  document.body.appendChild(card);

  try{
    const clonedSvgs = panelWrap.querySelectorAll('svg');
    for(const svg of clonedSvgs){
      const liveSvg = svg.id ? panel.querySelector('#'+CSS.escape(svg.id)) : null;
      if(!liveSvg) continue;
      const rect = liveSvg.getBoundingClientRect();
      if(rect.width < 1 || rect.height < 1) continue;
      /* The ring svg fills its (explicitly resized) wrap, so rasterize it at
         EXPORT_STYLE.ringSize; anything else scales with the panel width. */
      const inRing = !!svg.closest('.ring-svg-wrap');
      const targetW = inRing ? EXPORT_STYLE.ringSize : rect.width*scale;
      const targetH = inRing ? EXPORT_STYLE.ringSize : rect.height*scale;
      try{
        const {img} = await svgToPngImage(liveSvg, targetW, targetH);
        img.style.cssText = svg.getAttribute('style') || '';
        img.style.width = Math.round(targetW) + 'px';
        img.style.height = Math.round(targetH) + 'px';
        img.style.display = 'block';
        if(svg.getAttribute('class')) img.className = svg.getAttribute('class');
        svg.replaceWith(img);
      }catch(e){ /* leave the original svg if rasterizing fails */ }
    }

    const canvas = await html2canvas(card, {backgroundColor:'#f6f1e7', scale:EXPORT_STYLE.pixelRatio, useCORS:true});
    await new Promise((resolve,reject)=>{
      canvas.toBlob(async blob=>{
        if(!blob){ reject(new Error('toBlob failed')); return; }
        try{
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          resolve();
        }catch(err){
          try{
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'ust_allocations_by_region.png'; a.click();
            URL.revokeObjectURL(url);
            resolve();
          }catch(e2){ reject(e2); }
        }
      }, 'image/png');
    });
    showCopyToast('Diagram image copied!');
  }catch(err){
    showCopyToast('Could not copy image');
  }finally{
    document.body.removeChild(card);
  }
}

/* ════════════════════════════════════
   RESPONSIVE SCALE
   Matches the other panels' fixed-size scaling exactly (565x496).
════════════════════════════════════ */
(function setupResponsiveScale(){
  const EXPLORER_W = 565, EXPLORER_H = 496;
  const container = document.getElementById('explorer-scale-container');
  const wrap = document.getElementById('explorer-wrap');
  if(!container || !wrap) return;

  function applyScale(){
    const availW = container.clientWidth;
    const scale = availW / EXPLORER_W;
    wrap.style.transform = `scale(${scale})`;
    const h = Math.round(EXPLORER_H * scale);
    container.style.height = h + 'px';
    if(window.parent !== window){
      window.parent.postMessage({type:'ust-allocations-by-region-height', height:h}, '*');
    }
  }

  applyScale();
  window.addEventListener('resize', applyScale);
})();
