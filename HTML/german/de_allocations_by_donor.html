/* CSS gives shapes their stroke/fill via stylesheet rules that won't travel with a
   standalone serialized SVG, so bake the relevant computed styles into inline
   style attributes on a 1:1 cloned tree before serializing. */
function inlineComputedStyles(srcEl, destEl){
  const props = ['fill','stroke','stroke-width','stroke-dasharray','opacity','fill-opacity','stroke-opacity','font-size','font-family','font-weight','text-anchor','dominant-baseline'];
  const cs = getComputedStyle(srcEl);
  let style = '';
  props.forEach(p=>{ const v = cs.getPropertyValue(p); if(v) style += `${p}:${v};`; });
  if(style) destEl.setAttribute('style', style + (destEl.getAttribute('style')||''));
  const srcChildren = srcEl.children;
  const destChildren = destEl.children;
  for(let i=0;i<srcChildren.length;i++){
    inlineComputedStyles(srcChildren[i], destChildren[i]);
  }
}

function svgToPngImage(svgEl, w, h){
  return new Promise((resolve,reject)=>{
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));
    const clone = svgEl.cloneNode(true);
    inlineComputedStyles(svgEl, clone);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    if(!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const xml = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w * 2; canvas.height = h * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2,2);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const out = new Image();
      out.onload = () => resolve({img: out, w, h});
      out.onerror = reject;
      out.src = canvas.toDataURL('image/png');
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGE-EXPORT STYLE SETTINGS — tweak these to change the exported PNG.

   All sizes are px of the export layout (the card is laid out `width` px
   wide, then rendered at width × pixelRatio actual image pixels).

   - width          : exported image width. The height follows the chart
                      body's on-screen aspect ratio automatically.
   - pixelRatio     : resolution multiplier for the final PNG (2 = retina).
   - titleFontSize  : the blue title in the header.
   - logoWidth      : Kiel logo width in the top-right corner.
   - headerPadding  : CSS padding of the header block. The 2nd value (right
                      padding, 380px) must stay wide enough that the title
                      doesn't run underneath the logo.
   - footerFontSize / footerPadding : the "Data source: …" note at the bottom.
   - legendFontSize / legendSwatch   : the series key ("Bilateral allocations /
                      Share of EU allocations"). On screen it floats over the
                      bottom-right of the plot next to the icon buttons; in the
                      export the buttons are dropped and it becomes a normal
                      right-aligned row under the last bar.

   Note there is no bottom trim here: unlike the region chart, the plot's
   bottom padding is only BOTTOM_PAD (which keeps the last bar clear of the
   footer icons), and the export drops the icons — so trimming it would clip
   the last bar rather than remove dead space. The export renders the FULL
   ranking, including the rows that scroll out of view on screen.
   ═════════════════════════════════════════════════════════════════════ */
const EXPORT_STYLE = {
  width:            1600,
  pixelRatio:       2,
  titleFontSize:    68,
  logoWidth:        340,
  headerPadding:    '20px 380px 16px 22px',
  footerFontSize:   30,
  footerPadding:    '16px 22px',
  legendFontSize:   28,
  legendSwatch:     26,
};

async function copyChartAsImage(){
  const panel = document.getElementById('explorer-wrap');
  if(!panel) return;

  const EXPORT_W = EXPORT_STYLE.width;

  const card = document.createElement('div');
  card.style.cssText = `position:fixed;left:-99999px;top:0;width:${EXPORT_W}px;background:#f6f1e7;font-family:${getComputedStyle(document.body).fontFamily};color:#1a1a1a;`;

  const header = document.createElement('div');
  header.style.cssText = `position:relative;padding:${EXPORT_STYLE.headerPadding};min-height:150px;box-sizing:border-box;display:flex;align-items:center;`;
  header.innerHTML = `
    <div style="font-size:${EXPORT_STYLE.titleFontSize}px;font-weight:700;line-height:1.25;color:#174abb;">${document.querySelector('.chart-title').textContent}</div>
  `;
  const logoWrap = document.createElement('div');
  logoWrap.style.cssText = `position:absolute;top:20px;right:22px;width:${EXPORT_STYLE.logoWidth}px;display:flex;align-items:center;`;
  const logoImg = document.querySelector('.kiel-logo img');
  const logoClone = logoImg.cloneNode(true);
  logoClone.style.cssText = 'width:100%;height:auto;display:block;';
  logoWrap.appendChild(logoClone);
  header.appendChild(logoWrap);

  const panelClone = panel.cloneNode(true);
  panelClone.querySelectorAll('.chart-header, .chart-controls, .footer-icons').forEach(el=>el.remove());
  panelClone.style.border = 'none';
  panelClone.style.borderRadius = '0';
  panelClone.style.boxShadow = 'none';
  panelClone.style.transform = 'none';
  panelClone.style.width = EXPORT_W + 'px';
  panelClone.style.height = 'auto';
  panelClone.style.overflow = 'visible';

  const panelRect = panel.getBoundingClientRect();
  const scale = EXPORT_W / panelRect.width;

  /* .bar-body is flex:1 and #bar-scroll clips the ranking to the card. The
     export has neither constraint: let the rasterized SVGs define the height,
     and open the scroller up so a long ranking comes out whole instead of
     being cut off at the on-screen scroll position. */
  const clonedBody = panelClone.querySelector('.bar-body');
  clonedBody.style.flex = 'none';
  clonedBody.style.height = 'auto';
  const clonedScroll = panelClone.querySelector('#bar-scroll');
  clonedScroll.style.overflow = 'visible';
  clonedScroll.style.flex = 'none';
  clonedScroll.style.height = 'auto';
  const clonedEmpty = panelClone.querySelector('.empty-note');
  if (clonedEmpty) clonedEmpty.style.position = 'static';

  /* On screen .chart-footer is an absolutely-positioned overlay pinned to the
     bottom of the card, which in an export sized to the FULL ranking would
     drop it on top of the last bars. With the icon buttons gone, only the
     legend is left in it, so it is unpinned and flows as an ordinary row
     under the plot — and its type is scaled up with the rest of the export. */
  const clonedFooter = panelClone.querySelector('.chart-footer');
  if (clonedFooter) {
    const clonedLegend = clonedFooter.querySelector('.bar-legend');
    if (clonedLegend && clonedLegend.style.display !== 'none') {
      clonedFooter.style.position = 'static';
      clonedFooter.style.padding = '4px 22px 10px';
      clonedLegend.style.background = 'none';
      clonedLegend.style.padding = '0';
      clonedLegend.style.gap = Math.round(EXPORT_STYLE.legendFontSize * 0.9) + 'px';
      clonedLegend.style.fontSize = EXPORT_STYLE.legendFontSize + 'px';
      clonedLegend.querySelectorAll('.legend-swatch').forEach(sw => {
        sw.style.width = EXPORT_STYLE.legendSwatch + 'px';
        sw.style.height = EXPORT_STYLE.legendSwatch + 'px';
      });
    } else {
      clonedFooter.remove();
    }
  }

  const panelWrap = document.createElement('div');
  panelWrap.style.cssText = `position:relative;width:${EXPORT_W}px;overflow:visible;background:#f6f1e7;padding-bottom:8px;`;
  panelWrap.appendChild(panelClone);

  const footer = document.createElement('div');
  footer.style.cssText = `padding:${EXPORT_STYLE.footerPadding};font-size:${EXPORT_STYLE.footerFontSize}px;line-height:1.5;border-top:1px solid #ddd6c8;`;
  footer.innerHTML = `<strong>Datenquelle:</strong> Kiel Institut für Weltwirtschaft – ${RELEASE_LABEL}`;

  card.appendChild(header);
  card.appendChild(panelWrap);
  card.appendChild(footer);
  document.body.appendChild(card);

  try{
    const clonedSvgs = panelWrap.querySelectorAll('svg');
    for(const svg of clonedSvgs){
      const liveSvg = svg.id ? panel.querySelector('#'+CSS.escape(svg.id)) : null;
      if(!liveSvg) continue;
      /* The bar SVG can be taller than its scroller, so its own attributes —
         not its clipped on-screen box — define the export size. */
      const w = liveSvg.clientWidth || liveSvg.getBoundingClientRect().width;
      const h = Number(liveSvg.getAttribute('height')) || liveSvg.getBoundingClientRect().height;
      if(w < 1 || h < 1) continue;
      const targetW = w*scale, targetH = h*scale;
      try{
        const {img} = await svgToPngImage(liveSvg, targetW, targetH);
        img.style.cssText = svg.getAttribute('style') || '';
        img.style.width = Math.round(targetW) + 'px';
        img.style.height = Math.round(targetH) + 'px';
        img.style.display = 'block';
        if(svg.getAttribute('class')) img.className = svg.getAttribute('class');
        svg.replaceWith(img);
      }catch(e){ /* leave the original svg if rasterizing fails */ }
    }

    const canvas = await html2canvas(card, {backgroundColor:'#f6f1e7', scale:EXPORT_STYLE.pixelRatio, useCORS:true});
    await new Promise((resolve,reject)=>{
      canvas.toBlob(async blob=>{
        if(!blob){ reject(new Error('toBlob failed')); return; }
        try{
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          resolve();
        }catch(err){
          try{
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${METRIC.fileStem}.png`; a.click();
            URL.revokeObjectURL(url);
            resolve();
          }catch(e2){ reject(e2); }
        }
      }, 'image/png');
    });
    showCopyToast('Bild des Diagramms kopiert!');
  }catch(err){
    showCopyToast('Bild konnte nicht kopiert werden');
  }finally{
    document.body.removeChild(card);
  }
}

    html += `<p class="info-def"><strong>EU-Institutionen</strong> umfasst Hilfen, die von den Organen der Europäischen Union selbst bereitgestellt und aus dem EU-Haushalt sowie gemeinsamen Instrumenten wie der Makrofinanzhilfe, der Ukraine-Fazilität und der Europäischen Friedensfazilität finanziert werden.</p>`;
    html += `<p class="info-def"><strong>EU-Mitgliedstaaten</strong> summiert die bilateralen Hilfen der EU-Mitgliedstaaten; <strong>Kontinentaleuropa</strong> ergänzt die europäischen Geber außerhalb der Union (Vereinigtes Königreich, Norwegen, Schweiz, Island).</p>`;
    html += `<p>Nicht enthalten sind private Spenden, Unterstützung für Geflüchtete außerhalb der Ukraine sowie Hilfen internationaler Organisationen. Die Werte sind in jeweiligen Euro angegeben.</p>`;
    html += `<div class="info-source"><strong>Datenquelle:</strong> Kiel Institut für Weltwirtschaft – ${RELEASE_LABEL}</div>`;
    bodyEl.innerHTML = html;
    overlay.classList.add('open');

  function closeInfoModal(){
    overlay.classList.remove('open');

  document.getElementById('info-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(modal.classList.contains('open')) closeInfoModal(); else openInfoModal();

    if(e.key === 'Escape' && modal.classList.contains('open')) closeInfoModal();
  });

/* ════════════════════════════════════
   RESPONSIVE REFLOW

   Same contract as the other cards: the card fills 100% of the iframe in both
   axes, re-renders on every size change so the SVGs are drawn at real pixel
   dimensions rather than being zoomed, and posts a height HINT to an embedder
   that opts in to auto-sizing. The hint keeps the original 565:496 card
   proportions, so this row lines up with the ones above and below it.
════════════════════════════════════ */
(function setupResponsiveReflow(){
  const ASPECT = 496 / 565;      // original card proportions
  const MIN_H = 360, MAX_H = 900;
  const wrap = document.getElementById('explorer-wrap');
  if(!wrap) return;

  let lastSent = 0;
  function suggestHeight(){
    if(window.parent === window) return;
    const w = wrap.clientWidth;
    if(!w) return;
    const h = Math.round(Math.max(MIN_H, Math.min(MAX_H, w * ASPECT)));
    if(h === lastSent) return;        // avoid a resize<->postMessage feedback loop
    lastSent = h;
    window.parent.postMessage({type: METRIC.msgType, height:h}, '*');
  }

  function onResize(){
    if(typeof renderChart === 'function' && DONOR_DATA.length) renderChart();
    suggestHeight();
  }

  if(typeof ResizeObserver !== 'undefined'){
    new ResizeObserver(onResize).observe(wrap);
  } else {
    window.addEventListener('resize', onResize);
  }
  suggestHeight();
})();
</script>
