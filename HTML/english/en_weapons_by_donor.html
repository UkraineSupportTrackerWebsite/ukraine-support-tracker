<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ukraine Support Tracker – Weapons Allocated by Donor</title>
  <link rel="stylesheet" href="../../assets/css/chart-base.css" />
  <link rel="stylesheet" href="../../assets/css/weapons_by_donor.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <script src="../../assets/chart-layout.js"></script>
  <script src="../../assets/export-desktop.js"></script>

<body>

<div class="explorer-scale-container" id="explorer-scale-container">
<div class="explorer-wrap" id="explorer-wrap">

  <div class="chart-header">
    <div class="chart-title" id="chart-title-text">Military Equipment Allocated to Ukraine, by Type</div>
    <div class="kiel-logo">

  <div class="chart-controls">
    <div class="sort-custom" id="weapon-cat-custom">

      </button>
      <div class="sort-custom-dropdown" id="weapon-cat-dropdown">
        <div class="sort-custom-option" data-value="Air Defense">Air Defense Systems</div>
        <div class="sort-custom-option" data-value="Tanks">Tanks</div>
        <div class="sort-custom-option" data-value="IFV">Infantry Fighting Vehicles</div>
        <div class="sort-custom-option active" data-value="Howitzers">Howitzers</div>
        <div class="sort-custom-option" data-value="MLRS">Multiple Launch Rocket Systems</div>
      </div>
    </div>
  </div>

  <div class="tbl-scroll">
    <table class="data-table" id="weapon-table">
      <thead>
        <tr>
          <th class="sortable" data-col="donor" style="min-width:110px">Countries <span class="sort-arrow">↕</span></th>
          <th class="num sortable" data-col="count" style="min-width:100px"><span id="count-header-label">Number of Weapons</span> <span class="sort-arrow">↕</span></th>
          <th class="num sortable" data-col="value_eur" style="min-width:100px">Monetary Value <span class="sort-arrow">↕</span></th>
          <th style="min-width:220px">List of Weapons</th>
        </tr>
      </thead>
      <tbody id="weapon-tbody"></tbody>
    </table>
  </div>

  <div class="chart-footer">
    <div class="footer-icons">
      <button class="footer-icon-btn" id="info-btn" title="About this data">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><line x1="8" y1="7.1" x2="8" y2="11.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="4.85" r="0.95" fill="currentColor"/></svg>
      </button>
      <button class="footer-icon-btn" id="dl-btn" title="Download data">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3 4 3-4M2 13h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="share-wrap">
        <button class="footer-icon-btn" id="share-btn" title="Share">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="13" cy="3" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="3" cy="8" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="13" cy="13" r="1.6" stroke="currentColor" stroke-width="1.3"/><line x1="4.6" y1="7.2" x2="11.4" y2="4" stroke="currentColor" stroke-width="1.2"/><line x1="4.6" y1="8.8" x2="11.4" y2="12" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <div class="share-dropdown" id="share-dropdown">
          <div class="share-dropdown-title">Share</div>
          <div class="share-option" id="opt-image">
            <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="7" r="1.2" stroke="currentColor" stroke-width="1.1"/><polyline points="1,11 5,7.5 8,10 11,7 15,11" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
            Copy table as image
          </div>
          <div class="share-option" id="opt-link">
            <svg viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5a3.5 3.5 0 0 0 4.95 0l2-2a3.5 3.5 0 0 0-4.95-4.95l-1 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 6.5a3.5 3.5 0 0 0-4.95 0l-2 2a3.5 3.5 0 0 0 4.95 4.95l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            Copy link to table
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="copy-toast">Link copied!</div>

  <!-- ── Info Modal ── -->
  <div id="info-overlay"></div>

    <button id="info-close" title="Close">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div id="info-modal-inner">

    </div>

</div><!-- /.explorer-wrap -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="../../assets/data-loader.js"></script>
<script>
/* ════════════════════════════════════
   DATA
   Loaded at runtime from data/weapons.csv (see ../../assets/data-loader.js).
   Aggregated from the main dataset joined against the Price List sheet
   (item -> category + unit price). The CSV's "weapons_list" column packs
   each row's individual weapon models as "Name (count)", separated by "; ".
════════════════════════════════════ */
let WEAPON_ROWS = [];
let RELEASE_LABEL = 'Ukraine Support Tracker, Release 30 (07/2026)';

function parseWeaponsList(text){
  return String(text).split(';').map(s => s.trim()).filter(Boolean).map(entry => {
    const m = entry.match(/^(.*)\s\((\d+)\)$/);
    return m ? { name: m[1], count: Number(m[2]) } : { name: entry, count: 0 };
  });
}

function weaponRowsFromCSV(rows){
  return rows.map(r => ({
    donor: r.donor,
    category: r.category,
    count: Number(r.number_of_weapons),
    value_eur: Number(r.monetary_value_eur),
    weapons: parseWeaponsList(r.weapons_list)
  }));
}

const CATEGORY_INFO = {
  "Air Defense": { title: "Air Defense Systems Allocated to Ukraine, by Donor", noun: "air defense systems", countLabel: "Number of Air Defense Systems" },
  "Tanks":       { title: "Tanks Allocated to Ukraine, by Donor", noun: "tanks", countLabel: "Number of Tanks" },
  "IFV":         { title: "Infantry Fighting Vehicles Allocated to Ukraine, by Donor", noun: "infantry fighting vehicles", countLabel: "Number of Infantry Fighting Vehicles" },
  "Howitzers":   { title: "Howitzers Allocated to Ukraine, by Donor", noun: "howitzers (152/155mm)", countLabel: "Number of Howitzers" },
  "MLRS":        { title: "Multiple Launch Rocket Systems Allocated to Ukraine, by Donor", noun: "multiple launch rocket systems", countLabel: "Number of MLRS" }
};

function formatWeaponsList(weapons){
  return weapons.map(w => `${w.name} (${w.count})`).join(', ');
}

function formatValueEUR(v){
  if(!v) return '€0 mln';
  const mln = v / 1e6;
  if(mln >= 1000) return `€${(mln/1000).toFixed(2)} bn`;
  if(mln < 10) return `€${mln.toFixed(1)} mln`;
  return `€${mln.toFixed(0)} mln`;
}

let currentCategory = 'Howitzers';
const tblSort = { col: 'count', dir: -1 };

function renderTable(category){
  if (category) currentCategory = category;
  document.getElementById('count-header-label').textContent = CATEGORY_INFO[currentCategory].countLabel;
  const rows = WEAPON_ROWS
    .filter(r => r.category === currentCategory)
    .sort((a,b) => {
      const va = a[tblSort.col];
      const vb = b[tblSort.col];
      if (typeof va === 'string') return tblSort.dir * va.localeCompare(vb);
      return tblSort.dir * (va - vb);
    });

  const tbody = document.getElementById('weapon-tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.donor}</td>
      <td class="num">${r.count.toLocaleString('en-US')}</td>
      <td class="num">${formatValueEUR(r.value_eur)}</td>
      <td class="weapons-list">${formatWeaponsList(r.weapons)}</td>
    </tr>
  `).join('');

  document.querySelectorAll('#weapon-table th .sort-arrow').forEach(s=>s.textContent='↕');
  document.querySelectorAll('#weapon-table th.sortable').forEach(th => {
    if (th.dataset.col === tblSort.col) th.querySelector('.sort-arrow').textContent = tblSort.dir===-1?'↓':'↑';
    th.onclick = () => {
      const col = th.dataset.col;
      if (tblSort.col === col) tblSort.dir *= -1;
      else { tblSort.col = col; tblSort.dir = -1; }
      renderTable();
    };
  });
}

(function(){
  const btn = document.getElementById('weapon-cat-btn');
  const label = document.getElementById('weapon-cat-label');
  const dropdown = document.getElementById('weapon-cat-dropdown');
  const options = dropdown.querySelectorAll('.sort-custom-option');

  btn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('open'); });
  document.addEventListener('click', () => dropdown.classList.remove('open'));
  dropdown.addEventListener('click', e => e.stopPropagation());

  options.forEach(opt => opt.addEventListener('click', () => {
    options.forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    label.textContent = opt.textContent;
    dropdown.classList.remove('open');
    renderTable(opt.dataset.value);
  }));

})();

async function init(){
  const rows = await USTData.fetchCSV('weapons.csv');
  WEAPON_ROWS = weaponRowsFromCSV(rows);
  RELEASE_LABEL = await USTData.fetchReleaseLabel(RELEASE_LABEL);
  renderTable('Howitzers');
}
init();

/* ════════════════════════════════════
   DOWNLOAD (XLSX export of the currently visible category)
════════════════════════════════════ */
let kielLogoPng = null;
async function getKielLogoPng(){
  if (kielLogoPng) return kielLogoPng;
  const svgText = await fetch('../../assets/Kiel Institut Logo.svg').then(r => r.text());
  const svgBlob = new Blob([svgText], {type:'image/svg+xml'});
  const svgUrl  = URL.createObjectURL(svgBlob);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve; img.onerror = reject; img.src = svgUrl;
  });
  const scale = 3;
  const canvas = document.createElement('canvas');
  canvas.width  = img.naturalWidth  * scale;
  canvas.height = img.naturalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(svgUrl);
  kielLogoPng = {
    dataUrl: canvas.toDataURL('image/png'),
    width: img.naturalWidth, height: img.naturalHeight
  };
  return kielLogoPng;
}

function rowsForCategory(category){
  const sortCol = category === currentCategory ? tblSort.col : 'count';
  const sortDir = category === currentCategory ? tblSort.dir : -1;
  return WEAPON_ROWS
    .filter(r => r.category === category)
    .sort((a,b) => {
      const va = a[sortCol];
      const vb = b[sortCol];
      if (typeof va === 'string') return sortDir * va.localeCompare(vb);
      return sortDir * (va - vb);
    });
}

async function addWeaponSheet(wb, category){
  const rows = rowsForCategory(category);
  const info = CATEGORY_INFO[category];
  const ws = wb.addWorksheet(info.title.slice(0, 31), { views: [{ showGridLines: false }] });

  const leftPad = 2, topPad = 2;
  const dataColCount = 4;
  const firstCol = leftPad + 1;
  const lastCol  = leftPad + dataColCount;
  const logoCol  = lastCol + 1;

  for (let i = 0; i < topPad; i++) ws.addRow([]);

  ws.mergeCells(topPad + 1, firstCol, topPad + 1, lastCol);
  ws.mergeCells(topPad + 2, firstCol, topPad + 2, lastCol);
  ws.mergeCells(topPad + 3, firstCol, topPad + 3, lastCol);

  const titleCell = ws.getCell(topPad + 1, firstCol);
  titleCell.value = `Ukraine Support Tracker — ${info.title}`;
  titleCell.font = { name: 'Calibri', size: 16, bold: true, color: { argb: 'FFFF6B00' } };
  ws.getRow(topPad + 1).height = 26;

  const releaseCell = ws.getCell(topPad + 2, firstCol);
  releaseCell.value = RELEASE_LABEL;
  releaseCell.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FF555555' } };
  ws.getRow(topPad + 2).height = 15;

  const sourceCell = ws.getCell(topPad + 3, firstCol);
  sourceCell.value = 'Data Source: Kiel Institute for the World Economy — Ukraine Support Tracker (kiel-institute.de/ukraine)';
  sourceCell.font = { name: 'Calibri', size: 8.5, italic: true, color: { argb: 'FF888888' } };
  ws.getRow(topPad + 3).height = 14;
  ws.addRow([]);

  const headerRow = ws.addRow([...Array(leftPad).fill(null), 'Country', info.countLabel, 'Monetary Value (€)', 'List of Weapons']);
  headerRow.eachCell({ includeEmpty: false }, cell => {
    cell.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3A6DC5' } };
    cell.alignment = { vertical: 'middle' };
  });
  headerRow.height = 18;

  rows.forEach(r => {
    const dataRow = ws.addRow([...Array(leftPad).fill(null), r.donor, r.count, r.value_eur, formatWeaponsList(r.weapons)]);
    dataRow.font = { name: 'Calibri', size: 10 };
  });

  ws.columns = [
    ...Array(leftPad).fill({ width: 3 }),
    { width: 22 }, { width: 18 }, { width: 18 }, { width: 60 }
  ];

  try {
    const logo = await getKielLogoPng();
    const imgId = wb.addImage({ base64: logo.dataUrl, extension: 'png' });
    const logoDisplayHeight = 64;
    const logoDisplayWidth  = logoDisplayHeight * (logo.width / logo.height);
    ws.addImage(imgId, {
      tl: { col: logoCol - 1 + 0.05, row: topPad + 0.05 },
      ext: { width: logoDisplayWidth, height: logoDisplayHeight },
      editAs: 'absolute'
    });
  } catch (e) {
    console.warn('Could not embed Kiel Institute logo in export:', e);
  }

  return ws;
}

async function downloadWorkbook(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* ════════════════════════════════════
   DOWNLOAD (all equipment types, one sheet each, regardless of the
   category currently shown on screen)
════════════════════════════════════ */
document.getElementById('dl-btn').addEventListener('click', async () => {
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Kiel Institute for the World Economy — Ukraine Support Tracker';
  wb.created = new Date();
  for (const category of Object.keys(CATEGORY_INFO)) {
    await addWeaponSheet(wb, category);
  }
  await downloadWorkbook(wb, 'Ukraine Support Tracker, Military Equipment Allocated to Ukraine, by Type.xlsx');
});

/* ════════════════════════════════════
   SHARE (image / link)
════════════════════════════════════ */
(function(){
  const shareBtn = document.getElementById('share-btn');
  const shareDropdown = document.getElementById('share-dropdown');
  shareBtn.addEventListener('click', e=>{ e.stopPropagation(); shareDropdown.classList.toggle('open'); });
  document.addEventListener('click', ()=>shareDropdown.classList.remove('open'));
  shareDropdown.addEventListener('click', e=>e.stopPropagation());
})();

function showCopyToast(msg){
  const toast = document.getElementById('copy-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

document.getElementById('opt-link').addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href).catch(()=>{});
  document.getElementById('share-dropdown').classList.remove('open');
  showCopyToast('Link copied!');
});

/* ═════════════════════════════════════════════════════════════════════
   IMAGE-EXPORT STYLE SETTINGS — tweak these to change the exported PNG.

   All sizes are px of the export layout (the card is laid out `width` px
   wide, then rendered at width × pixelRatio actual image pixels).

   - width          : exported image width. The height grows automatically
                      to fit however many table rows the selected weapon
                      category has, so it is not settable directly.
   - pixelRatio     : resolution multiplier for the final PNG (2 = retina).
                      Changes sharpness/file size, not layout proportions.
   - titleFontSize  : the blue title in the header.
   - logoHeight     : Kiel logo height in the top-right corner.
   - headerPadding  : CSS padding of the header block. The 2nd value (right
                      padding, 360px) must stay wide enough that the title
                      doesn't run underneath the logo.
   - footerFontSize / footerPadding : the "Data source: …" note at the bottom.
   ═════════════════════════════════════════════════════════════════════ */
const EXPORT_STYLE = {
  width:          1600,
  pixelRatio:     2,
  titleFontSize:  47,
  logoHeight:     100,
  headerPadding:  '18px 360px 14px 22px',
  colHeaderFontSize: 12,
  footerFontSize: 26,
  footerPadding:  '16px 22px',
};

async function copyChartAsImage(){
  const panel = document.getElementById('explorer-wrap');
  if(!panel) return;

  const EXPORT_W = EXPORT_STYLE.width;

  const card = document.createElement('div');
  card.style.cssText = `position:fixed;left:-99999px;top:0;width:${EXPORT_W}px;background:#f6f1e7;font-family:${getComputedStyle(document.body).fontFamily};color:#1a1a1a;`;

  const header = document.createElement('div');
  const headerMinHeight = EXPORT_STYLE.logoHeight + 36;
  header.style.cssText = `position:relative;padding:${EXPORT_STYLE.headerPadding};min-height:${headerMinHeight}px;border-bottom:1px solid #ddd6c8;box-sizing:border-box;background:#f6f1e7;display:flex;flex-direction:column;justify-content:center;`;
  header.innerHTML = `
    <div style="font-size:${EXPORT_STYLE.titleFontSize}px;font-weight:700;line-height:1.25;color:#174abb;">${document.getElementById('chart-title-text').textContent}</div>
  `;
  const logoWrap = document.createElement('div');
  logoWrap.style.cssText = `position:absolute;top:50%;right:18px;transform:translateY(-50%);height:${EXPORT_STYLE.logoHeight}px;display:flex;align-items:center;`;
  const logoImg = document.querySelector('.kiel-logo img');
  const logoClone = logoImg.cloneNode(true);
  logoClone.style.cssText = 'height:100%;width:auto;display:block;';
  logoWrap.appendChild(logoClone);
  header.appendChild(logoWrap);

  const panelClone = panel.cloneNode(true);
  panelClone.querySelectorAll('.chart-header, .chart-controls, .footer-icons').forEach(el=>el.remove());
  panelClone.querySelectorAll('.sort-arrow').forEach(el=>el.remove());

  const panelWrap = document.createElement('div');
  panelWrap.style.cssText = `position:relative;width:${EXPORT_W}px;overflow:visible;background:#f6f1e7;`;

  /* The table's row count varies with the selected weapon category, so like the
     Data Explorer's table export, lay the clone out at its natural on-screen
     width (full row height, nothing scrolled out of view) and visually scale
     the whole thing up to EXPORT_W with a CSS transform, then measure the
     clone's real rendered height once attached to size panelWrap to match. */
  const panelRect = panel.getBoundingClientRect();
  const scale = EXPORT_W / panelRect.width;
  panelClone.style.flex = 'none';
  panelClone.style.width = panelRect.width + 'px';
  panelClone.style.height = 'auto';
  panelClone.style.overflow = 'visible';
  panelClone.style.border = 'none';
  panelClone.style.borderRadius = '0';
  panelClone.style.boxShadow = 'none';
  panelClone.style.position = 'relative';
  panelClone.style.left = '0';
  panelClone.style.top = '0';
  panelClone.style.transform = `scale(${scale})`;
  panelClone.style.transformOrigin = 'top left';
  panelWrap.style.height = Math.round(panelRect.height * scale) + 'px';

  /* .tbl-scroll clips content to whatever fit on screen via overflow-y:auto —
     strip that in the clone so every row lays out at its natural size instead
     of being scrolled out of view. */
  panelClone.querySelectorAll('.tbl-scroll').forEach(el=>{
    el.style.overflow = 'visible';
    el.style.flex = 'none';
    el.style.height = 'auto';
    el.style.maxHeight = 'none';
  });

  /* The live table lets the "List of Weapons" column run off-screen and
     scroll horizontally — there's no scrolling in a static image export, so
     pin the table to the panel's width and let that column wrap instead of
     being cut off at the export boundary. */
  panelClone.querySelectorAll('.data-table').forEach(el=>{
    el.style.width = '100%';
  });
  panelClone.querySelectorAll('td.weapons-list').forEach(el=>{
    el.style.whiteSpace = 'normal';
  });
  panelClone.querySelectorAll('.data-table th').forEach(el=>{
    el.style.fontSize = EXPORT_STYLE.colHeaderFontSize + 'px';
  });
  panelClone.style.background = '#f6f1e7';
  panelClone.querySelectorAll('.data-table, .data-table tr, .data-table td, .data-table th').forEach(el=>{
    el.style.background = '#f6f1e7';
  });
  panelClone.querySelectorAll('.tbl-scroll').forEach(el=>{
    let p = el.parentElement;
    while(p && p !== panelClone){
      p.style.flex = 'none';
      p.style.minHeight = '0';
      p.style.height = 'auto';
      p = p.parentElement;
    }
  });

  panelWrap.appendChild(panelClone);

  const footer = document.createElement('div');
  footer.style.cssText = `padding:${EXPORT_STYLE.footerPadding};font-size:${EXPORT_STYLE.footerFontSize}px;line-height:1.5;border-top:1px solid #ddd6c8;background:#f6f1e7;`;
  footer.innerHTML = `<strong>Data source:</strong> Kiel Institute for the World Economy – ${RELEASE_LABEL}`;

  card.appendChild(header);
  card.appendChild(panelWrap);
  card.appendChild(footer);
  document.body.appendChild(card);

  /* Now that panelClone is attached with height:auto, measure its real height
     and resize panelWrap to match (scaled), same as the Data Explorer export. */
  const cloneRect = panelClone.getBoundingClientRect();
  panelWrap.style.height = Math.round(cloneRect.height) + 'px';

  try{
    const canvas = await html2canvas(card, {backgroundColor:'#f6f1e7', scale:EXPORT_STYLE.pixelRatio, useCORS:true});
    await new Promise((resolve,reject)=>{
      canvas.toBlob(async blob=>{
        if(!blob){ reject(new Error('toBlob failed')); return; }
        try{
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          resolve();
        }catch(err){
          try{
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'ust_weapons_by_country.png'; a.click();
            URL.revokeObjectURL(url);
            resolve();
          }catch(e2){ reject(e2); }
        }
      }, 'image/png');
    });
    showCopyToast('Table image copied!');
  }catch(err){
    showCopyToast('Could not copy image');
  }finally{
    document.body.removeChild(card);
  }
}

document.getElementById('opt-image').addEventListener('click', () => {
  document.getElementById('share-dropdown').classList.remove('open');
  document.getElementById('weapon-cat-dropdown').classList.remove('open');
  document.getElementById('info-overlay').classList.remove('open');
  document.getElementById('info-modal').classList.remove('open');
  copyChartAsImageDesktop();
});

/* An exported chart should look like the chart, not like the device it was
   copied from. copyChartAsImage() builds its PNG from the live card, so on a
   phone it inherited the phone layout and proportions; this stages the card
   at its canonical desktop size first, off-screen, so every device produces
   the same image. See ../../assets/export-desktop.js. */
function copyChartAsImageDesktop(){
  if(!window.USTExport) return copyChartAsImage();
  const size = USTExport.DESKTOP.weapons;
  return USTExport.withDesktopLayout(
    {width: size.width, height: size.height,},
    copyChartAsImage);
}

/* ════════════════════════════════════
   INFO MODAL
════════════════════════════════════ */
(function(){
  const overlay = document.getElementById('info-overlay');
  const modal = document.getElementById('info-modal');
  const bodyEl = document.getElementById('info-body');

  function openInfoModal(){
    let html = '';
    html += `<div class="info-tag-row"><span class="info-tag">${CATEGORY_INFO[currentCategory].title.split(' Allocated')[0]}</span></div>`;
    html += `<p>Covers in-kind military allocations of heavy weapon systems to Ukraine by donor country, tracked from January 24, 2022 to April 30, 2026. Excludes ammunition, spare parts, and undisclosed sub-components.</p>`;
    html += `<p>Values are in euros, estimated from unit price lists and reported package values.</p>`;
    html += `<div class="info-source"><strong>Data source:</strong> Kiel Institute for the World Economy – ${RELEASE_LABEL}</div>`;
    bodyEl.innerHTML = html;
    overlay.classList.add('open');
    modal.classList.add('open');
  }
  function closeInfoModal(){
    overlay.classList.remove('open');
    modal.classList.remove('open');
  }
  document.getElementById('info-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(modal.classList.contains('open')) closeInfoModal(); else openInfoModal();
  });
  overlay.addEventListener('click', closeInfoModal);
  document.getElementById('info-close').addEventListener('click', closeInfoModal);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) closeInfoModal();
  });
})();

/* ════════════════════════════════════
   RESPONSIVE REFLOW

   The card fills 100% of the iframe in both axes (see .explorer-wrap), so it
   can never leave a margin no matter what size the embed gives it.

   Unlike the chart pages there is nothing to re-render on resize: the table
   is laid out by the browser (.tbl-scroll is flex:1 with its own scrolling,
   and .data-table is min-width:100%), so it reflows for free. All that
   remains is suggesting a height to embedders who opt in to auto-sizing —
   the page renders correctly at whatever height it is actually given.
════════════════════════════════════ */
(function setupResponsiveReflow(){
  const ASPECT = 496 / 565;      // original card proportions
  const MIN_H = 360, MAX_H = 900;
  const wrap = document.getElementById('explorer-wrap');
  if(!wrap) return;

  let lastSent = 0;
  function suggestHeight(){
    /* Reserve a clear band at the bottom for the info/download/share buttons
       and their blurred backdrop, so they never sit on top of the legend or
       the last axis label. Runs standalone too — the collision is identical
       either way — and the reserved pixels are added back to the height we
       ask the embedder for, so clearing the buttons costs the plot nothing. */
    /* reserve:false — this card is a table, and its rows are meant to run all
       the way to the bottom edge and pass *under* the blurred backdrop, the
       way the buttons float over a chart on the other cards. Reserving the
       band instead ended the rows above the buttons and left a bare strip.
       The band is still measured and still added to the height below, so the
       card asks its embedder for exactly the same number of pixels. */
    const band = window.USTLayout ? USTLayout.applyFooterBand(wrap, {reserve:false}) : 0;
    if(window.parent === window) return;
    /* Staged off-screen at desktop size for an image export (USTExport): the
       height that box asks for is not the height this viewport wants, and
       the card is about to move back. Reporting it would resize the embedding
       iframe to a card that is no longer there. */
    if(window.USTExport && USTExport.isExporting()) return;
    const w = wrap.clientWidth;
    if(!w) return;
    const h = Math.round(Math.max(MIN_H, Math.min(MAX_H, w * ASPECT)) + band);
    if(h === lastSent) return;        // avoid a resize<->postMessage feedback loop
    lastSent = h;
    window.parent.postMessage({type:'ust-weapons-height', height:h}, '*');
  }

  if(typeof ResizeObserver !== 'undefined'){
    new ResizeObserver(suggestHeight).observe(wrap);
  } else {
    window.addEventListener('resize', suggestHeight);
  }
  /* Re-measure once the chart has actually drawn: the first call runs
     before the CSV has loaded, when there is no axis label or legend to
     collide with the buttons yet. */
  if(window.USTLayout && USTLayout.watch) USTLayout.watch(wrap, suggestHeight);
  suggestHeight();
})();
</script>
