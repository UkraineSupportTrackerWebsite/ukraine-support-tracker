<script>
/* ════════════════════════════════════
   DATA
   Loaded at runtime from data/total_allocations.csv (see ../../assets/data-loader.js).
   Monthly (non-cumulative) sums across all donor countries + EU institutions.
════════════════════════════════════ */
let MONTHLY = [];
let CUMUL = [];
let RELEASE_LABEL = 'Ukraine Support Tracker, Release 30 (07/2026)';

const MONTH_NAMES = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function ymLabel(y,m){ return `${MONTH_NAMES[m-1]} ${y}`; }
function ymKey(y,m){ return y*100+m; }

function computeCumul(){
  let cTot=0,cMil=0,cFin=0,cHum=0;
  return MONTHLY.map(d=>{
    cTot+=d.tot; cMil+=d.mil; cFin+=d.fin; cHum+=d.hum;
    return {y:d.y,m:d.m,alloc:cTot,milit:cMil,financ:cFin,hum:cHum};
  });
}

const CATS = [
  {key:'alloc', label:'Gesamtzuweisungen', color:'#ff6b00'},
  {key:'milit', label:'Militärisch',        color:'#0d2c66'},
  {key:'financ',label:'Finanziell',         color:'#3a6dc5'},
  {key:'hum',   label:'Humanitär',          color:'#8fc1e8'}
];
function catInfo(key){ return CATS.find(c=>c.key===key); }

let activeCats = new Set(['alloc', 'milit', 'financ', 'hum']);

/* ════════════════════════════════════
   CATEGORY SELECTOR
════════════════════════════════════ */
function updateCatLabel(){
  const label = document.getElementById('cat-label');
  label.textContent = 'Kategorien auswählen';
}

(function(){
  const btn = document.getElementById('cat-btn');
  const dropdown = document.getElementById('cat-dropdown');
  const boxes = dropdown.querySelectorAll('input[type="checkbox"]');
  btn.addEventListener('click', e=>{ e.stopPropagation(); dropdown.classList.toggle('open'); });
  document.addEventListener('click', ()=>dropdown.classList.remove('open'));
  dropdown.addEventListener('click', e=>e.stopPropagation());
  boxes.forEach(box=>box.addEventListener('change', ()=>{
    const val = box.dataset.value;
    if(box.checked) activeCats.add(val); else activeCats.delete(val);
    if(activeCats.size===0){ box.checked=true; activeCats.add(val); }
    updateCatLabel();
    renderChart();
  }));
  updateCatLabel();
})();

/* ════════════════════════════════════
   TOOLTIP
════════════════════════════════════ */
function showTooltip(event, d){
  const tt = document.getElementById('chart-tooltip');
  const rows = CATS.map(c => `
    <div class="tt-row">
      <span class="tt-key"><span class="tt-dot" style="background:${c.color}"></span>${c.label}</span>
      <span class="tt-val">${d[c.key].toFixed(2)} Mrd. €</span>
    </div>`).join('');
  tt.innerHTML = `<div class="tt-date">${ymLabel(d.y,d.m)}</div>${rows}`;
  tt.style.display = 'block';

  /* #chart-tooltip is position:fixed but lives inside .explorer-wrap, which
     is scaled via CSS transform (see setupResponsiveScale). A transform on an
     ancestor makes it the containing block for fixed descendants, so the
     tooltip's own left/top/width get scaled too. Counter-scale here so a
     value of N px always lands N real screen px from the cursor. */
  const wrap = document.getElementById('explorer-wrap');
  const wrapRect = wrap.getBoundingClientRect();
  const scale = wrapRect.width / wrap.offsetWidth || 1;
  const invScale = 1 / scale;

  const offset = 12;
  const ttW = (tt.offsetWidth || 190) * scale;
  const ttH = (tt.offsetHeight || 100) * scale;
  let leftScreen = event.clientX + offset;
  let topScreen = event.clientY + offset;
  if(leftScreen + ttW > window.innerWidth - 10) leftScreen = event.clientX - ttW - offset;
  if(topScreen + ttH > window.innerHeight - 10) topScreen = event.clientY - ttH - offset;

  /* convert desired real-screen position into the wrap's transformed
     coordinate space, since fixed positioning here resolves against wrap */
  const left = (leftScreen - wrapRect.left) * invScale;
  const top = (topScreen - wrapRect.top) * invScale;
  tt.style.transform = '';
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}
function hideTooltip(){ document.getElementById('chart-tooltip').style.display = 'none'; }

/* ════════════════════════════════════
   CHART
════════════════════════════════════ */
function renderChart(){
  const wrap = document.querySelector('.line-chart-wrap');
  const W = wrap.clientWidth || 700, H = wrap.clientHeight || 220;
  const pad = {t:20, r:20, b:35, l:55};
  const iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;

  const svg = d3.select('#line-svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  svg.selectAll('*').remove();
  const g = svg.append('g').attr('transform', `translate(${pad.l},${pad.t})`);

  const xDomain = CUMUL.map(d => ymKey(d.y, d.m));
  const cats = [...activeCats];
  const allVals = CUMUL.flatMap(d => cats.map(k => d[k]));
  const mx = Math.max(...allVals, 0.01);

  const xSc = d3.scalePoint().domain(xDomain).range([0, iW]);
  const ySc = d3.scaleLinear().domain([0, mx * 1.1]).range([iH, 0]).nice();
  const yTickVals = ySc.ticks(5).length >= 2 ? ySc.ticks(5) : [0, ySc.domain()[1]];

  g.append('g').selectAll('line').data(yTickVals).enter().append('line')
    .attr('x1', 0).attr('x2', iW).attr('y1', d=>ySc(d)).attr('y2', d=>ySc(d))
    .attr('stroke', '#e0e0e0');

  const janTicks = CUMUL.filter(d => d.m === 1).map(d => ymKey(d.y, d.m));
  g.append('g').selectAll('line').data(janTicks).enter().append('line')
    .attr('x1', d=>xSc(d)).attr('x2', d=>xSc(d)).attr('y1', 0).attr('y2', iH)
    .attr('stroke', '#e0e0e0');
  g.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(xSc).tickValues(janTicks).tickFormat(k=>{const d=CUMUL.find(z=>ymKey(z.y,z.m)===k); return d?d.y:'';}).tickSize(3).tickPadding(8))
    .call(g=>g.select('.domain').attr('stroke','#ddd'))
    .call(g=>g.selectAll('text').style('font-size','0.88rem').style('fill','#000'));

  g.append('g')
    .call(d3.axisLeft(ySc).tickValues(yTickVals).tickFormat(d=>d.toFixed(1)))
    .call(g=>g.select('.domain').remove())
    .call(g=>g.selectAll('line').attr('stroke','#eee'))
    .call(g=>g.selectAll('text').style('font-size','0.88rem').style('fill','#000'));

  svg.append('text')
    .attr('text-anchor', 'end')
    .attr('font-size', '0.9rem')
    .attr('fill', '#000')
    .attr('x', pad.l - 4)
    .attr('y', pad.t - 8)
    .text('Mrd. €');

  const lineFn = d3.line().x(d=>xSc(ymKey(d.y,d.m))).y(d=>ySc(d.v));

  cats.forEach(key=>{
    const info = catInfo(key);
    const pts = CUMUL.map(d=>({y:d.y, m:d.m, v:d[key]}));
    g.append('path').datum(pts).attr('fill','none').attr('stroke',info.color).attr('stroke-width',2).attr('d',lineFn);
    g.selectAll(null).data(pts).enter().append('circle')
      .attr('cx',d=>xSc(ymKey(d.y,d.m))).attr('cy',d=>ySc(d.v)).attr('r',2.35).attr('fill',info.color);
  });

  /* single shared hover target across the whole chart width, snapping to nearest month */
  const bisect = d3.bisector(k => k).left;
  const overlay = g.append('rect')
    .attr('x', 0).attr('y', 0).attr('width', iW).attr('height', iH)
    .attr('fill', 'transparent')
    .style('cursor', 'default');

  const hoverLine = g.append('line')
    .attr('y1', 0).attr('y2', iH)
    .attr('stroke', '#999').attr('stroke-width', 1)
    .attr('stroke-dasharray', '3,3')
    .style('display', 'none');

  const hoverLineY = g.append('line')
    .attr('x1', 0).attr('x2', iW)
    .attr('stroke', '#999').attr('stroke-width', 1)
    .attr('stroke-dasharray', '3,3')
    .style('display', 'none');

  const hoverDots = g.append('g').style('display', 'none');
  cats.forEach(key=>{
    const info = catInfo(key);
    hoverDots.append('circle').attr('class', 'hd-'+key).attr('r', 3).attr('fill', info.color);
  });

  overlay.on('mousemove', (event) => {
    const [mx0, my0] = d3.pointer(event);
    const domainVals = xDomain;
    const step = iW / (domainVals.length - 1 || 1);
    let idx = Math.round(mx0 / step);
    idx = Math.max(0, Math.min(domainVals.length - 1, idx));
    const d = CUMUL[idx];
    const xPos = xSc(ymKey(d.y, d.m));
    let nearestKey = cats[0], best = Infinity;
    cats.forEach(key=>{
      const dist = Math.abs(ySc(d[key]) - my0);
      if(dist < best){ best = dist; nearestKey = key; }
    });
    const yPos = ySc(d[nearestKey]);
    hoverLine.attr('x1', xPos).attr('x2', xPos).style('display', null);
    hoverLineY.attr('y1', yPos).attr('y2', yPos).style('display', null);
    hoverDots.style('display', null);
    cats.forEach(key=>{
      hoverDots.select('.hd-'+key).attr('cx', xPos).attr('cy', ySc(d[key]));
    });
    showTooltip(event, d);
  }).on('mouseleave', () => {
    hoverLine.style('display', 'none');
    hoverLineY.style('display', 'none');
    hoverDots.style('display', 'none');
    hideTooltip();
  });

  const legend = document.getElementById('line-legend');
  legend.innerHTML = cats.map(key=>{
    const info = catInfo(key);
    return `<span class="legend-item"><span class="legend-dot" style="background:${info.color}"></span>${info.label}</span>`;
  }).join('');
}

async function init(){
  const rows = await USTData.fetchCSV('total_allocations.csv');
  MONTHLY = rows.map(r => ({
    y: r.year, m: r.month,
    tot: r.total_allocations, mil: r.military, fin: r.financial, hum: r.humanitarian
  })).sort((a,b) => ymKey(a.y,a.m) - ymKey(b.y,b.m));
  CUMUL = computeCumul();
  RELEASE_LABEL = await USTData.fetchReleaseLabel(RELEASE_LABEL);
  renderChart();
}
init();
/* resize re-render is handled by the ResizeObserver in setupResponsiveReflow */

/* ════════════════════════════════════
   DOWNLOAD (always all categories, all dates) —
   formatted Excel workbook in the same style as the Data Explorer export
════════════════════════════════════ */

/* Rasterize the Kiel Institute SVG logo to a PNG data URL via canvas,
   since ExcelJS can only embed PNG/JPEG images, not SVG. */
let kielLogoPng = null;
async function getKielLogoPng(){
  if (kielLogoPng) return kielLogoPng;
  const svgText = await fetch('../../assets/Kiel Institut Logo.svg').then(r => r.text());
  const svgBlob = new Blob([svgText], {type:'image/svg+xml'});
  const svgUrl  = URL.createObjectURL(svgBlob);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve; img.onerror = reject; img.src = svgUrl;
  });
  const scale = 3;
  const canvas = document.createElement('canvas');
  canvas.width  = img.naturalWidth  * scale;
  canvas.height = img.naturalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(svgUrl);
  kielLogoPng = {
    dataUrl: canvas.toDataURL('image/png'),
    width: img.naturalWidth, height: img.naturalHeight
  };
  return kielLogoPng;
}

document.getElementById('dl-btn').addEventListener('click', async () => {
  const start = CUMUL[0], end = CUMUL[CUMUL.length - 1];
  const rangeLabel = `${ymLabel(start.y,start.m)}–${ymLabel(end.y,end.m)}`;

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Kiel Institut für Weltwirtschaft — Ukraine Support Tracker';
  wb.created = new Date();
  const ws = wb.addWorksheet('Gesamtzuweisungen', { views: [{ showGridLines: false }] });

  const leftPad = 2; // blank columns reserved to the left of the table
  const topPad  = 2; // blank rows reserved above the title
  const dataColCount = 5; // Date, Total, Military, Financial, Humanitarian
  const firstCol = leftPad + 1;
  const lastCol  = leftPad + dataColCount;
  const logoCol  = lastCol + 1; // dedicated blank column so the logo never overlaps title text

  for (let i = 0; i < topPad; i++) ws.addRow([]);

  ws.mergeCells(topPad + 1, firstCol, topPad + 1, lastCol);
  ws.mergeCells(topPad + 2, firstCol, topPad + 2, lastCol);
  ws.mergeCells(topPad + 3, firstCol, topPad + 3, lastCol);
  ws.mergeCells(topPad + 4, firstCol, topPad + 4, lastCol);
  ws.mergeCells(topPad + 5, firstCol, topPad + 5, lastCol);

  const titleCell = ws.getCell(topPad + 1, firstCol);
  titleCell.value = 'Ukraine Support Tracker — Gesamtzuweisungen an die Ukraine, nach Kategorie';
  titleCell.font = { name: 'Calibri', size: 16, bold: true, color: { argb: 'FFFF6B00' } };
  ws.getRow(topPad + 1).height = 26;

  const releaseCell = ws.getCell(topPad + 2, firstCol);
  releaseCell.value = RELEASE_LABEL;
  releaseCell.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FF555555' } };
  ws.getRow(topPad + 2).height = 15;

  const subtitleCell = ws.getCell(topPad + 3, firstCol);
  subtitleCell.value = `Alle Kategorien · ${rangeLabel} · Alle Länder + EU-Institutionen`;
  subtitleCell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF333333' } };
  ws.getRow(topPad + 3).height = 18;

  const noteCell = ws.getCell(topPad + 4, firstCol);
  noteCell.value = 'Die Gesamtzuweisungen sowie die militärischen, finanziellen und humanitären Zuweisungen sind über alle Geberländer und die EU-Institutionen kumuliert, vom Beginn der Erfassung bis zum jeweils angezeigten Monat.';
  noteCell.font = { name: 'Calibri', size: 8.5, italic: true, color: { argb: 'FF888888' } };
  ws.getRow(topPad + 4).height = 14;

  const sourceCell = ws.getCell(topPad + 5, firstCol);
  sourceCell.value = 'Datenquelle: Kiel Institut für Weltwirtschaft — Ukraine Support Tracker (kiel-institute.de/ukraine)';
  sourceCell.font = { name: 'Calibri', size: 8.5, italic: true, color: { argb: 'FF888888' } };
  ws.getRow(topPad + 5).height = 14;
  ws.addRow([]);

  const headerRow = ws.addRow([...Array(leftPad).fill(null), 'Datum', 'Gesamtzuweisungen (Mrd. €)', 'Militärisch (Mrd. €)', 'Finanziell (Mrd. €)', 'Humanitär (Mrd. €)']);
  headerRow.eachCell({ includeEmpty: false }, cell => {
    cell.font = { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3A6DC5' } };
    cell.alignment = { vertical: 'middle' };
  });
  headerRow.height = 18;

  CUMUL.forEach(d => {
    const dataRow = ws.addRow([...Array(leftPad).fill(null), new Date(d.y, d.m - 1, 1), d.alloc, d.milit, d.financ, d.hum]);
    dataRow.getCell(firstCol).numFmt = 'mmm yyyy';
    [1,2,3,4].forEach(i => dataRow.getCell(firstCol + i).numFmt = '0.0000');
    dataRow.font = { name: 'Calibri', size: 10 };
  });

  ws.columns = [
    ...Array(leftPad).fill({ width: 3 }),
    { width: 14 }, { width: 22 }, { width: 16 }, { width: 16 }, { width: 18 }
  ];

  try {
    const logo = await getKielLogoPng();
    const imgId = wb.addImage({ base64: logo.dataUrl, extension: 'png' });
    const logoDisplayHeight = 64;
    const logoDisplayWidth  = logoDisplayHeight * (logo.width / logo.height);
    ws.addImage(imgId, {
      tl: { col: logoCol - 1 + 0.05, row: topPad + 0.05 },
      ext: { width: logoDisplayWidth, height: logoDisplayHeight },
      editAs: 'absolute'
    });
  } catch (e) {
    console.warn('Could not embed Kiel Institute logo in export:', e);
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'Ukraine Support Tracker, Gesamtzuweisungen an die Ukraine, nach Kategorie.xlsx';
  a.click();
  URL.revokeObjectURL(url);
});

  const shareBtn = document.getElementById('share-btn');
  const shareDropdown = document.getElementById('share-dropdown');

  document.addEventListener('click', ()=>shareDropdown.classList.remove('open'));
  shareDropdown.addEventListener('click', e=>e.stopPropagation());
})();

function showCopyToast(msg){
  const toast = document.getElementById('copy-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

document.getElementById('opt-link').addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href).catch(()=>{});
  document.getElementById('share-dropdown').classList.remove('open');

});

/* CSS gives shapes their stroke/fill via stylesheet rules that won't travel with a
   standalone serialized SVG, so bake the relevant computed styles into inline
   style attributes on a 1:1 cloned tree before serializing. */
function inlineComputedStyles(srcEl, destEl){
  const props = ['fill','stroke','stroke-width','stroke-dasharray','opacity','fill-opacity','stroke-opacity'];
  const cs = getComputedStyle(srcEl);
  let style = '';
  props.forEach(p=>{ const v = cs.getPropertyValue(p); if(v) style += `${p}:${v};`; });
  if(style) destEl.setAttribute('style', style + (destEl.getAttribute('style')||''));
  const srcChildren = srcEl.children;
  const destChildren = destEl.children;
  for(let i=0;i<srcChildren.length;i++){
    inlineComputedStyles(srcChildren[i], destChildren[i]);
  }
}

function svgToPngImage(svgEl, w, h){
  return new Promise((resolve,reject)=>{
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));
    const clone = svgEl.cloneNode(true);
    inlineComputedStyles(svgEl, clone);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    if(!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const xml = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w * 2; canvas.height = h * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2,2);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const out = new Image();
      out.onload = () => resolve({img: out, w, h});
      out.onerror = reject;
      out.src = canvas.toDataURL('image/png');
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGE-EXPORT STYLE SETTINGS — tweak these to change the exported PNG.

   All sizes are px of the export layout (the card is laid out `width` px
   wide, then rendered at width × pixelRatio actual image pixels).

   - width          : exported image width. The height follows the chart's
                      on-screen aspect ratio automatically.
   - pixelRatio     : resolution multiplier for the final PNG (2 = retina).
                      Changes sharpness/file size, not layout proportions.
   - titleFontSize  : the blue title in the header.
   - logoWidth      : Kiel logo width in the top-right corner.
   - headerPadding  : CSS padding of the header block. The 2nd value (right
                      padding, 300px) must stay wide enough that the title
                      doesn't run underneath the logo.
   - legendFontSize / legendDotSize : the series legend under the chart.
   - footerFontSize / footerPadding : the "Data source: …" note at the bottom.
   ═════════════════════════════════════════════════════════════════════ */
const EXPORT_STYLE = {
  width:          1600,
  pixelRatio:     2,
  titleFontSize:  52,
  logoWidth:      260,
  headerPadding:  '20px 300px 16px 22px',
  legendFontSize: 32,
  legendDotSize:  16,
  footerFontSize: 30,
  footerPadding:  '20px 22px',
};

async function copyChartAsImage(){
  const panel = document.getElementById('explorer-wrap');
  if(!panel) return;

  const EXPORT_W = EXPORT_STYLE.width;

  const card = document.createElement('div');
  card.style.cssText = `position:fixed;left:-99999px;top:0;width:${EXPORT_W}px;background:#f6f1e7;font-family:${getComputedStyle(document.body).fontFamily};color:#1a1a1a;`;

  const header = document.createElement('div');
  header.style.cssText = `position:relative;padding:${EXPORT_STYLE.headerPadding};min-height:150px;box-sizing:border-box;display:flex;align-items:center;`;
  header.innerHTML = `
    <div style="font-size:${EXPORT_STYLE.titleFontSize}px;font-weight:700;line-height:1.25;color:#174abb;">${document.querySelector('.chart-title').textContent}</div>
  `;
  const logoWrap = document.createElement('div');
  logoWrap.style.cssText = `position:absolute;top:20px;right:22px;width:${EXPORT_STYLE.logoWidth}px;display:flex;align-items:center;`;
  /* A PNG with both dimensions in px, not a clone of the live SVG <img>:
     WebKit and Blink disagree about an SVG image with an `auto` dimension
     inside a box html2canvas has measured, and on iOS the logo came out
     cropped to a couple of orange bars. See USTExport.logoElement. */
  const logoImg = document.querySelector('.kiel-logo img');
  logoWrap.appendChild(await USTExport.logoElement(logoImg, {width: EXPORT_STYLE.logoWidth}));
  header.appendChild(logoWrap);

  /* The line chart's SVG is CSS width:100%/height:100% with a viewBox, so it
     scales cleanly with its container — rasterize it directly at the export
     resolution (like Data Explorer's line/globe export) rather than laying the
     clone out at live size and blowing it up with an ancestor CSS transform.
     html2canvas doesn't reliably rasterize a swapped-in <img> that sits under a
     transform:scale() ancestor, which is what caused the export to render blank. */
  const panelClone = panel.cloneNode(true);
  panelClone.querySelectorAll('.chart-header, .chart-controls, .footer-icons').forEach(el=>el.remove());
  panelClone.style.border = 'none';
  panelClone.style.borderRadius = '0';
  panelClone.style.boxShadow = 'none';
  panelClone.style.transform = 'none';
  panelClone.style.width = EXPORT_W + 'px';
  /* .explorer-wrap has a fixed height:496px in its own stylesheet rule for the
     live on-screen card; that still applies to the clone via the shared class
     and would clip the export to that height regardless of content. Let it
     size to its (now taller/shorter) children instead. */
  panelClone.style.height = 'auto';
  panelClone.style.overflow = 'visible';

  const panelRect = panel.getBoundingClientRect();
  const scale = EXPORT_W / panelRect.width;

  /* .line-chart-wrap is flex:1, filling whatever height is left over after its
     flex siblings. Removing .chart-header/.chart-controls above frees up that
     space, which flex:1 would hand straight to the chart wrap instead — pin it
     to its live height (scaled) so it keeps the same proportions as on screen. */
  const liveChartWrap = panel.querySelector('.line-chart-wrap');
  const clonedChartWrap = panelClone.querySelector('.line-chart-wrap');
  const chartWrapRect = liveChartWrap.getBoundingClientRect();
  clonedChartWrap.style.flex = 'none';
  clonedChartWrap.style.height = Math.round(chartWrapRect.height * scale) + 'px';

  const panelWrap = document.createElement('div');
  panelWrap.style.cssText = `position:relative;width:${EXPORT_W}px;overflow:visible;background:#f6f1e7;`;
  panelWrap.appendChild(panelClone);

  const legend = panelClone.querySelector('#line-legend');
  if(legend){
    legend.style.fontSize = EXPORT_STYLE.legendFontSize + 'px';
    legend.style.gap = '0.6rem 2rem';
    legend.style.padding = '10px 22px 20px';
    legend.querySelectorAll('.legend-dot').forEach(el=>{
      el.style.width = EXPORT_STYLE.legendDotSize + 'px';
      el.style.height = EXPORT_STYLE.legendDotSize + 'px';
    });
    legend.querySelectorAll('.legend-item').forEach(el=>{ el.style.gap = '0.5rem'; });
  }

  const footer = document.createElement('div');
  footer.style.cssText = `padding:${EXPORT_STYLE.footerPadding};font-size:${EXPORT_STYLE.footerFontSize}px;line-height:1.5;border-top:1px solid #ddd6c8;`;
  footer.innerHTML = `<strong>Datenquelle:</strong> Kiel Institut für Weltwirtschaft – ${RELEASE_LABEL}`;

  card.appendChild(header);
  card.appendChild(panelWrap);
  card.appendChild(footer);
  document.body.appendChild(card);

  try{
    const clonedSvgs = panelWrap.querySelectorAll('svg');
    for(const svg of clonedSvgs){
      const liveSvg = svg.id ? panel.querySelector('#'+CSS.escape(svg.id)) : null;
      if(!liveSvg) continue;
      const rect = liveSvg.getBoundingClientRect();
      if(rect.width < 1 || rect.height < 1) continue;
      try{
        const {img} = await svgToPngImage(liveSvg, rect.width*scale, rect.height*scale);
        img.style.cssText = svg.getAttribute('style') || '';
        img.style.width = Math.round(rect.width*scale) + 'px';
        img.style.height = Math.round(rect.height*scale) + 'px';
        img.style.display = 'block';
        if(svg.getAttribute('class')) img.className = svg.getAttribute('class');
        svg.replaceWith(img);
      }catch(e){ /* leave the original svg if rasterizing fails */ }
    }

    const canvas = await html2canvas(card, {backgroundColor:'#f6f1e7', scale:EXPORT_STYLE.pixelRatio, useCORS:true});
    /* The blob goes back to the caller instead of being written here:
       deliverPng handed a promise for it to the clipboard before this
       capture started, and reports the outcome — including a failure in
       here, which now propagates instead of being swallowed. */
    return await USTExport.canvasToBlob(canvas);
  }finally{
    document.body.removeChild(card);
  }
}

document.getElementById('opt-image').addEventListener('click', () => {
  document.getElementById('share-dropdown').classList.remove('open');
  document.getElementById('cat-dropdown').classList.remove('open');
  document.getElementById('info-overlay').classList.remove('open');
  document.getElementById('info-modal').classList.remove('open');
  hideTooltip();
  copyChartAsImageDesktop();
});

/* An exported chart should look like the chart, not like the device it was
   copied from. copyChartAsImage() builds its PNG from the live card, so on a
   phone it inherited the phone layout and proportions; this stages the card
   at its canonical desktop size first, off-screen, so every device produces
   the same image. See ../../assets/export-desktop.js. */
function copyChartAsImageDesktop(){
  /* Called straight from the click handler, and reaches deliverPng before
     anything yields: WebKit only keeps the tap's clipboard permission alive
     if ClipboardItem is constructed in that same task, and the capture below
     takes seconds. Awaiting anything ahead of it breaks copying on iOS while
     still working in Chrome's device-emulation view. See export-desktop.js. */
  const size = USTExport.DESKTOP.tile;
  USTExport.deliverPng(function(){
    return USTExport.withDesktopLayout(
      {width: size.width, height: size.height,
       relayout(){ if(typeof renderChart === 'function') renderChart(); }},
      copyChartAsImage);
  }, {
    fileStem: 'ust_gesamtzuweisungen',
    onStatus: showCopyToast,
    copied:   'Bild der Grafik kopiert!',
    saved:    'Bild der Grafik gespeichert!',
    failed:   'Bild konnte nicht kopiert werden'
  });
}

(function(){
  const overlay = document.getElementById('info-overlay');
  const modal = document.getElementById('info-modal');
  const bodyEl = document.getElementById('info-body');

  function openInfoModal(){
    const start = CUMUL[0], end = CUMUL[CUMUL.length-1];
    const rangeLabel = `${ymLabel(start.y,start.m)}–${ymLabel(end.y,end.m)}`;
    const catLabels = [...activeCats].map(k=>catInfo(k).label);

    let html = '';
    html += `<div class="info-tag-row">
      ${catLabels.map(l=>`<span class="info-tag">${l}</span>`).join('')}
      <span class="info-tag">${rangeLabel}</span>
    </div>`;
    html += `<p><strong>Gesamtzuweisungen</strong> umfasst die kumulierten bilateralen staatlichen Hilfszuweisungen an die Ukraine aus allen vom Ukraine Support Tracker erfassten Geberländern sowie die Zuweisungen der EU-Institutionen (Kommission und Rat, MFA- und EIB-Mittel). Nicht enthalten sind private Spenden, Unterstützung für Geflüchtete außerhalb der Ukraine sowie Hilfen internationaler Organisationen. Finanzielle Zuweisungen, die ausdrücklich für militärische Zwecke und Waffenkäufe bestimmt sind, werden als militärische Hilfe gezählt.</p>`;
    html += `<p>Die Werte sind vom Beginn der Erfassung (Januar 2022) bis zum jeweils angezeigten Monat kumuliert und in jeweiligen Euro angegeben.</p>`;
    html += `<div class="info-source"><strong>Datenquelle:</strong> Kiel Institut für Weltwirtschaft – ${RELEASE_LABEL}</div>`;

    bodyEl.innerHTML = html;
    overlay.classList.add('open');
    modal.classList.add('open');
  }
  function closeInfoModal(){
    overlay.classList.remove('open');
    modal.classList.remove('open');
  }
  document.getElementById('info-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(modal.classList.contains('open')) closeInfoModal(); else openInfoModal();
  });
  overlay.addEventListener('click', closeInfoModal);
  document.getElementById('info-close').addEventListener('click', closeInfoModal);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) closeInfoModal();
  });
})();

/* ════════════════════════════════════
   RESPONSIVE REFLOW

   The card fills 100% of the iframe in both axes (see .explorer-wrap), so it
   can never leave a margin no matter what size the embed gives it. Two jobs
   remain:

     1. Re-render the chart whenever our box changes size, so the SVG is drawn
        at real pixel dimensions rather than being zoomed. A ResizeObserver on
        the wrap catches every case — window resize, iframe resize, and a
        parent that resizes us in response to (2).

     2. Suggest a height to the parent. This is only a HINT for embedders who
        opt in to auto-sizing; the page renders correctly at whatever height
        it is actually given, so an embedder may equally ignore it and pick a
        fixed height. The hint keeps the card's original 565:496 proportions,
        clamped so it never becomes a sliver or absurdly tall.
════════════════════════════════════ */
(function setupResponsiveReflow(){
  const ASPECT = 496 / 565;      // original card proportions
  const MIN_H = 360, MAX_H = 900;
  const wrap = document.getElementById('explorer-wrap');
  if(!wrap) return;

  let lastSent = 0;
  function suggestHeight(){
    /* Reserve a clear band at the bottom for the info/download/share buttons
       and their blurred backdrop, so they never sit on top of the legend or
       the last axis label. Runs standalone too — the collision is identical
       either way — and the reserved pixels are added back to the height we
       ask the embedder for, so clearing the buttons costs the plot nothing. */
    const band = window.USTLayout ? USTLayout.applyFooterBand(wrap) : 0;
    if(window.parent === window) return;
    /* Staged off-screen at desktop size for an image export (USTExport): the
       height that box asks for is not the height this viewport wants, and
       the card is about to move back. Reporting it would resize the embedding
       iframe to a card that is no longer there. */
    if(window.USTExport && USTExport.isExporting()) return;
    const w = wrap.clientWidth;
    if(!w) return;
    /* The band is reserved inside the card, not added on top of it. Adding
       it kept the plot exactly the same size but made the card taller by
       the same amount, which simply moved the collision out and left a
       dead strip between the last label and the buttons. Keeping the
       height as the aspect ratio dictates means the plot gives up those
       pixels instead, and the buttons sit directly under the content. */
    void band;
    const h = Math.round(Math.max(MIN_H, Math.min(MAX_H, w * ASPECT)));
    if(h === lastSent) return;        // avoid a resize<->postMessage feedback loop
    lastSent = h;
    window.parent.postMessage({type:'ust-total-allocations-height', height:h}, '*');
  }

  function onResize(){
    if(typeof renderChart === 'function') renderChart();
    suggestHeight();
  }

  /* A ResizeObserver on the wrap already covers window resize (the wrap is
     100% of the page), so only fall back to a window listener without it. */
  if(typeof ResizeObserver !== 'undefined'){
    new ResizeObserver(onResize).observe(wrap);
  } else {
    window.addEventListener('resize', onResize);
  }
  /* Re-measure once the chart has actually drawn: the first call runs
     before the CSV has loaded, when there is no axis label or legend to
     collide with the buttons yet. */
  if(window.USTLayout && USTLayout.watch) USTLayout.watch(wrap, suggestHeight);
  /* Reserving the band resizes the plot pane but not the card, so the
     ResizeObserver above never fires and the chart would keep the size it
     was first drawn at, scaled down by its own viewBox. Redraw it. */
  if(window.USTLayout && USTLayout.observeAnchor) USTLayout.observeAnchor(wrap, onResize);
  suggestHeight();
})();
</script>
